augmentation:
  enabled: true
  flip_prob: 0.5
dataset:
  image_size: 128
  input_channels: 1
  name: landsat9
  normalization:
    mode: local
    stats_file: null
  num_workers: 0
  output_channels: 3
  root_dir: data/landsat9/splits
  subset_ratio: 0.1
  subset_seed: 42
evaluation:
  image_size: 128
  percentile_high: 98.0
  percentile_low: 2.0
  save_format: tiff
  tta: true
logging:
  csv_path: logs/training.csv
  tensorboard_dir: logs/tensorboard
  use_wandb: false
loss:
  gan_mode: bce
  lambda_adv: 1.0
  lambda_chroma: 2.0
  lambda_feat: 0.0
  lambda_l1: 10.0
  lambda_perc: 10.0
  lambda_ssim: 5.0
model:
  generator:
    implementation: dynamic
  multi_scale_disc: false
paths:
  best_checkpoint: outputs/models/best/pix2pix_landsat_best.pth
  checkpoints: outputs/models/best
  final_checkpoint: outputs/models/final/pix2pix_landsat_final.pth
  latest_checkpoint: outputs/models/final/pix2pix_landsat_latest.pth
  logs: logs
  outputs: outputs
  visualizations: outputs/visualizations
project:
  modality: landsat9_tir_to_rgb
  name: InfraNova AI
  seed: 42
  task: colorization
scheduler:
  T_0: 50
  T_mult: 2
  eta_min: 1.0e-06
  type: linear
training:
  amp: true
  batch_size: 8
  decay_start_epoch: 1
  epochs: 10
  grad_clip: 1.0
  optimizer:
    beta1: 0.5
    beta2: 0.999
    lr: 0.0002
  patience: 40
  resume_from: null
  sample_every: 5
