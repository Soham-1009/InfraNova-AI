project:
  name: "InfraNova AI"
  task: "colorization"
  modality: "landsat9_b10_b11_to_rgb"
  seed: 42

dataset:
  name: "landsat9_b10_b11"
  root_dir: "data/landsat9_b10_b11/splits"
  image_size: 128
  input_channels: 2
  output_channels: 3
  num_workers: 2
  normalization:
    mode: "local"
    stats_file: null
  subset_ratio: null
  subset_seed: 42

model:
  generator:
    implementation: "hd"
  multi_scale_disc: true
  num_scales: 2

training:
  epochs: 100
  batch_size: 64
  decay_start_epoch: 50
  patience: 25
  amp: false
  grad_clip: 1.0
  sample_every: 1
  resume_from: null
  optimizer:
    lr: 0.0002
    beta1: 0.5
    beta2: 0.999

scheduler:
  type: "linear"
  T_0: 50
  T_mult: 2
  eta_min: 0.000001

loss:
  lambda_adv: 1.0
  lambda_l1: 10.0
  lambda_perc: 10.0
  lambda_ssim: 5.0
  lambda_chroma: 2.0
  lambda_feat: 5.0
  gan_mode: "bce"

augmentation:
  enabled: true
  flip_prob: 0.5

logging:
  use_wandb: false
  csv_path: "logs/training_pix2pixhd_100epochs.csv"
  tensorboard_dir: "logs/tensorboard"

evaluation:
  image_size: 128
  percentile_low: 2.0
  percentile_high: 98.0
  tta: true
  save_format: "tiff"

paths:
  checkpoints: "outputs"
  best_checkpoint: "outputs/best/pix2pix_landsat_best.pth"
  latest_checkpoint: "outputs/latest/pix2pix_landsat_latest.pth"
  final_checkpoint: "outputs/final/pix2pix_landsat_final.pth"
  logs: "logs"
  outputs: "outputs"
  visualizations: "outputs/visualizations"
