# Experiment 7 — gan_mode lsgan, lambda_sat 0.0 -> 0.05
# Single-variable change vs. the validated Experiment 6 resolved configuration
# (the LSGAN baseline: gan_mode="lsgan", all other loss weights identical to
#  Exp1 resolved config; lambda_sat was 0.0 in Exp6 because the key was absent
#  and CombinedLoss defaults to 0.0 when missing).
#
# Source of truth: configs/exp6_lsgan.yaml (Exp6 config SHA-256: e6157a43...)
# Exp6 resolved gan_mode: lsgan
# Exp7 scientific change: lambda_sat: 0.0 -> 0.05
# Exp7 gan_mode: lsgan (UNCHANGED from Exp6)
#
# Reuses Exp5's numerical-stability fix for SaturationLoss (1e-6 epsilon inside
# the chroma magnitude square roots, lines 152-156 of src/training/losses.py).
# Do NOT redesign SaturationLoss. Do NOT change gan_mode.
#
# Baseline checkpoint SHA-256 (LAPTOP, not modified here):
#   4604d36d07a0fb4c0696a53040c17004084068c51cc745a23f69b76c8baf6aa8
#
# All other settings identical to the Exp6 config. All output paths are
# redirected under outputs/exp7/ so Exp2/5/6 artifacts are never touched.

project:
  name: "InfraNova-AI-Exp7-Lsgan-LambdaSat"
  task: "colorization"
  modality: "landsat9_b10_b11_to_rgb"
  seed: 42

dataset:
  name: "landsat9_b10_b11"
  root_dir: "data/landsat9_b10_b11/splits"
  image_size: 128
  input_channels: 2
  output_channels: 3
  num_workers: 2
  normalization:
    mode: "local"
    stats_file: null
  subset_ratio: null
  subset_seed: 42

model:
  generator:
    implementation: "hd"
  multi_scale_disc: true
  num_scales: 2

training:
  epochs: 100
  batch_size: 64
  decay_start_epoch: 50
  patience: 25
  amp: false
  grad_clip: 1.0
  sample_every: 1
  resume_from: null
  optimizer:
    lr: 0.0002
    beta1: 0.5
    beta2: 0.999

scheduler:
  type: "linear"
  T_0: 50
  T_mult: 2
  eta_min: 0.000001

loss:
  lambda_adv: 1.0
  lambda_l1: 10.0
  lambda_perc: 5.0
  lambda_ssim: 5.0
  lambda_chroma: 2.0
  lambda_feat: 0.0
  lambda_sat: 0.05 # ONLY this value changed vs Exp6 (Exp6 had no lambda_sat key, defaults to 0.0)
  gan_mode: "lsgan" # UNCHANGED from Exp6 (was "bce" in Exp2; LSGAN carried over from Exp6)

augmentation:
  enabled: true
  flip_prob: 0.5

logging:
  use_wandb: false
  csv_path: "outputs/exp7/logs/training.csv"
  tensorboard_dir: "outputs/exp7/logs/tensorboard"

evaluation:
  image_size: 128
  percentile_low: 2.0
  percentile_high: 98.0
  tta: true
  save_format: "tiff"

paths:
  checkpoints: "outputs/exp7"
  best_checkpoint: "outputs/exp7/best/pix2pix_landsat_best.pth"
  latest_checkpoint: "outputs/exp7/latest/pix2pix_landsat_latest.pth"
  final_checkpoint: "outputs/exp7/final/pix2pix_landsat_final.pth"
  logs: "outputs/exp7/logs"
  outputs: "outputs/exp7"
  visualizations: "outputs/exp7/visualizations"
