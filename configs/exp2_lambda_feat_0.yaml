# Experiment 2 — lambda_feat 5.0 -> 0.0
# Single-variable change vs. the validated Experiment 1 resolved configuration.
#
# Source of truth: outputs/exp1/logs/env_record.json (config_resolved block)
# Exp1 config SHA-256: 1ba2c640b39826599538f2440b3054442957fa3a928abd4ecbab24f91632bf79
# Exp1 resolved lambda_feat: 5.0
# Exp2 scientific change: lambda_feat: 5.0 -> 0.0
#
# Baseline checkpoint SHA-256 (LAPTOP, not modified here):
#   4604d36d07a0fb4c0696a53040c17004084068c51cc745a23f69b76c8baf6aa8
#
# All other settings identical to the Exp1 RESOLVED config.
# All output paths are redirected under outputs/exp2/ so Exp1 artifacts
# are never touched.

project:
  name: "InfraNova-AI-Exp2-LambdaFeat0"
  task: "colorization"
  modality: "landsat9_b10_b11_to_rgb"
  seed: 42

dataset:
  name: "landsat9_b10_b11"
  root_dir: "data/landsat9_b10_b11/splits"
  image_size: 128
  input_channels: 2
  output_channels: 3
  num_workers: 2
  normalization:
    mode: "local"
    stats_file: null
  subset_ratio: null
  subset_seed: 42

model:
  generator:
    implementation: "hd"
  multi_scale_disc: true
  num_scales: 2

training:
  epochs: 100
  batch_size: 64
  decay_start_epoch: 50
  patience: 25
  amp: false
  grad_clip: 1.0
  sample_every: 1
  resume_from: null
  optimizer:
    lr: 0.0002
    beta1: 0.5
    beta2: 0.999

scheduler:
  type: "linear"
  T_0: 50
  T_mult: 2
  eta_min: 0.000001

loss:
  lambda_adv: 1.0
  lambda_l1: 10.0
  lambda_perc: 5.0
  lambda_ssim: 5.0
  lambda_chroma: 2.0
  lambda_feat: 0.0   # ONLY this value changed (was 5.0 in Exp1 resolved config)
  gan_mode: "bce"

augmentation:
  enabled: true
  flip_prob: 0.5

logging:
  use_wandb: false
  csv_path: "outputs/exp2/logs/training.csv"
  tensorboard_dir: "outputs/exp2/logs/tensorboard"

evaluation:
  image_size: 128
  percentile_low: 2.0
  percentile_high: 98.0
  tta: true
  save_format: "tiff"

paths:
  checkpoints: "outputs/exp2"
  best_checkpoint: "outputs/exp2/best/pix2pix_landsat_best.pth"
  latest_checkpoint: "outputs/exp2/latest/pix2pix_landsat_latest.pth"
  final_checkpoint: "outputs/exp2/final/pix2pix_landsat_final.pth"
  logs: "outputs/exp2/logs"
  outputs: "outputs/exp2"
  visualizations: "outputs/exp2/visualizations"
