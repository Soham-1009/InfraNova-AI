# Experiment 9 — Generator architecture: custom U-Net/local-enhancer -> Pix2PixHD Global ResNet
# Single-variable change vs. the validated Experiment 7 resolved configuration
# (the LSGAN + lambda_sat=0.05 baseline; all loss weights and training hyperparameters identical).
#
# Source of truth: configs/exp7_lsgan_lambda_sat.yaml (Exp7 config SHA-256: e36c7d4c...)
# Exp7 resolved generator: implementation="hd" (custom Dynamic U-Net + LocalEnhancer, 21,383,238 params)
# Exp9 scientific change: generator implementation = "hd" -> "resnet" (Pix2PixHD Global ResNet, 11,369,795 params)
# Exp9 gan_mode: lsgan (UNCHANGED from Exp7)
# Exp9 lambda_sat: 0.05 (UNCHANGED from Exp7)
#
# All loss weights LOCKED to Exp7 values:
#   lambda_adv=1.0, lambda_l1=10.0, lambda_perc=5.0, lambda_ssim=5.0,
#   lambda_chroma=2.0, lambda_feat=0.0, lambda_sat=0.05, gan_mode=lsgan
#
# Architecture: Pix2PixHDGlobalResNetGenerator
#   - 2-channel input (Band 10 + Band 11)
#   - 64-channel 7x7 reflection-padded input convolution
#   - 2 downsampling stages (128x128 -> 64x64 -> 32x32)
#   - 9 ResNet blocks at 32x32 / 256 channels
#   - 2 upsampling stages (32x32 -> 64x64 -> 128x128)
#   - 3-channel 7x7 reflection-padded output convolution + Tanh
#   - Exact parameter count: 11,369,795
#
# SaturationLoss numerical-stability fix (1e-6 epsilon) is preserved.
# Discriminator (MultiScaleDiscriminator, 2 scales) is UNCHANGED.
#
# Baseline checkpoint SHA-256 (LAPTOP, not modified here):
#   4604d36d07a0fb4c0696a53040c17004084068c51cc745a23f69b76c8baf6aa8
#
# All other settings identical to the Exp7 config. All output paths are
# redirected under outputs/exp9/ so prior experiment artifacts are never touched.

project:
  name: "InfraNova-AI-Exp9-ResNet-Generator"
  task: "colorization"
  modality: "landsat9_b10_b11_to_rgb"
  seed: 42

dataset:
  name: "landsat9_b10_b11"
  root_dir: "data/landsat9_b10_b11/splits"
  image_size: 128
  input_channels: 2
  output_channels: 3
  num_workers: 2
  normalization:
    mode: "local"
    stats_file: null
  subset_ratio: null
  subset_seed: 42

model:
  generator:
    implementation: "resnet"  # ONLY this value changed vs Exp7 (Exp7 had "hd")
  multi_scale_disc: true
  num_scales: 2

training:
  epochs: 100
  batch_size: 64
  decay_start_epoch: 50
  patience: 25
  amp: false
  grad_clip: 1.0
  sample_every: 1
  resume_from: null
  optimizer:
    lr: 0.0002
    beta1: 0.5
    beta2: 0.999

scheduler:
  type: "linear"
  T_0: 50
  T_mult: 2
  eta_min: 0.000001

loss:
  lambda_adv: 1.0
  lambda_l1: 10.0
  lambda_perc: 5.0
  lambda_ssim: 5.0
  lambda_chroma: 2.0
  lambda_feat: 0.0
  lambda_sat: 0.05   # UNCHANGED from Exp7
  gan_mode: "lsgan"  # UNCHANGED from Exp7

augmentation:
  enabled: true
  flip_prob: 0.5

logging:
  use_wandb: false
  csv_path: "outputs/exp9/logs/training.csv"
  tensorboard_dir: "outputs/exp9/logs/tensorboard"

evaluation:
  image_size: 128
  percentile_low: 2.0
  percentile_high: 98.0
  tta: true
  save_format: "tiff"

paths:
  checkpoints: "outputs/exp9"
  best_checkpoint: "outputs/exp9/best/pix2pix_landsat_best.pth"
  latest_checkpoint: "outputs/exp9/latest/pix2pix_landsat_latest.pth"
  final_checkpoint: "outputs/exp9/final/pix2pix_landsat_final.pth"
  logs: "outputs/exp9/logs"
  outputs: "outputs/exp9"
  visualizations: "outputs/exp9/visualizations"
