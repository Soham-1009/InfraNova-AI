# Experiment 4 — lambda_perc 5.0 -> 3.0
# Single-variable change vs. the validated Experiment 2 resolved configuration.
#
# Source of truth: outputs/exp2/logs/env_record.json (config_resolved block)
# Exp2 config SHA-256: 6969136a8fcba54f7f66e58bcadc92adb2ab2f5be2eead5c8c5e43e5b9139831
# Exp2 resolved lambda_perc: 5.0
# Exp4 scientific change: lambda_perc: 5.0 -> 3.0
#
# Rationale (from the Exp1/Exp2/Exp3 + long-run adjudication):
#   Exp1 long-run (224 epochs) at lambda_perc=5 showed val_sat_ratio drifting
#   to 0.60 (target 1.0) and the val curve plateauing around epoch 50.
#   Production winner test-set sat_ratio=1.10 vs long-run val sat_ratio=0.60
#   indicates the perceptual loss (VGG19-driven) rewards "safe" smooth outputs
#   at the cost of colorfulness when weighted too strongly.
#   Reducing lambda_perc from 5.0 -> 3.0 keeps the perceptual anchor but
#   reduces the smooth/desaturated bias. lambda_feat remains 0.0 (Exp2 result
#   showed no measurable contribution to structural fidelity). All other
#   weights unchanged.
#
# Baseline checkpoint SHA-256 (LAPTOP, not modified here):
#   4604d36d07a0fb4c0696a53040c17004084068c51cc745a23f69b76c8baf6aa8
#
# All other settings identical to the Exp2 RESOLVED config.
# All output paths are redirected under outputs/exp4/ so Exp1/2/3/long artifacts
# are never touched.

project:
  name: "InfraNova-AI-Exp4-LambdaPerc3"
  task: "colorization"
  modality: "landsat9_b10_b11_to_rgb"
  seed: 42

dataset:
  name: "landsat9_b10_b11"
  root_dir: "data/landsat9_b10_b11/splits"
  image_size: 128
  input_channels: 2
  output_channels: 3
  num_workers: 2
  normalization:
    mode: "local"
    stats_file: null
  subset_ratio: null
  subset_seed: 42

model:
  generator:
    implementation: "hd"
  multi_scale_disc: true
  num_scales: 2

training:
  epochs: 100
  batch_size: 64
  decay_start_epoch: 50
  patience: 25
  amp: false
  grad_clip: 1.0
  sample_every: 1
  resume_from: null
  optimizer:
    lr: 0.0002
    beta1: 0.5
    beta2: 0.999

scheduler:
  type: "linear"
  T_0: 50
  T_mult: 2
  eta_min: 0.000001

loss:
  lambda_adv: 1.0
  lambda_l1: 10.0
  lambda_perc: 3.0   # ONLY this value changed (was 5.0 in Exp2 resolved config)
  lambda_ssim: 5.0
  lambda_chroma: 2.0
  lambda_feat: 0.0
  gan_mode: "bce"

augmentation:
  enabled: true
  flip_prob: 0.5

logging:
  use_wandb: false
  csv_path: "outputs/exp4/logs/training.csv"
  tensorboard_dir: "outputs/exp4/logs/tensorboard"

evaluation:
  image_size: 128
  percentile_low: 2.0
  percentile_high: 98.0
  tta: true
  save_format: "tiff"

paths:
  checkpoints: "outputs/exp4"
  best_checkpoint: "outputs/exp4/best/pix2pix_landsat_best.pth"
  latest_checkpoint: "outputs/exp4/latest/pix2pix_landsat_latest.pth"
  final_checkpoint: "outputs/exp4/final/pix2pix_landsat_final.pth"
  logs: "outputs/exp4/logs"
  outputs: "outputs/exp4"
  visualizations: "outputs/exp4/visualizations"
